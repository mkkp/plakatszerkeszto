# .github/workflows/deploy.yml

# Name of the workflow
name: Build and Deploy to GitHub Pages

# Controls when the action will run.
# on: push: { branches: ["main"] } # Example: trigger on push to main branch
on:
  # Allows you to run this workflow manually from the Actions tab on any branch
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions it needs to deploy to GitHub Pages
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up Node.js in the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent LTS version of Node.js
          cache: 'npm'      # Cache npm dependencies for faster builds

      # 3. Installs project dependencies
      - name: Install dependencies
        run: npm ci # 'ci' is generally faster and more reliable for CI/CD environments

      # 4. Runs the build script defined in your package.json
      - name: Build project
        env:
          NODE_ENV: production
        run: npm run build

      # 5. Deploys the built project to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # The token to use for authentication. GITHUB_TOKEN is automatically created.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The directory to deploy. This should be the output of your build script.
          publish_dir: ./dist

